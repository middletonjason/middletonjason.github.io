<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BLE Scan</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1c1c1e; --muted: #6e6e73; --line: #d8d8dc;
    --accent: #0a66d8; --accent-fg: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --fg: #f2f2f7; --muted: #98989f; --line: #38383a;
      --accent: #4c9bff; --accent-fg: #000000;
      color-scheme: dark;
    }
  }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, system-ui, sans-serif;
    padding: env(safe-area-inset-top, 0) 16px env(safe-area-inset-bottom, 0);
  }
  h1 { font-size: 22px; margin: 20px 0 4px; }
  #status { color: var(--muted); margin: 0 0 16px; }
  button {
    font: inherit; font-weight: 600; border: 0; border-radius: 10px;
    padding: 12px 16px; margin: 0 8px 8px 0;
    background: var(--accent); color: var(--accent-fg);
  }
  button:disabled { opacity: 0.4; }
  ul { list-style: none; padding: 0; margin: 8px 0; }
  li { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .name { font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; word-break: break-all; }
  #scanList li { cursor: pointer; }
  label { display: block; margin: 4px 0 8px; color: var(--muted); }
</style>
</head>
<body>
  <h1>BLE Scan</h1>
  <p id="status">Tap a button to start.</p>

  <button id="scanBtn">Scan nearby</button>
  <button id="stopBtn" disabled>Stop</button>
  <button id="pickBtn">Pick and connect</button>
  <label><input type="checkbox" id="showUnnamed"> Show unnamed devices</label>

  <ul id="list"></ul>

<script>
const statusEl = document.getElementById('status');
const listEl = document.getElementById('list');
const scanBtn = document.getElementById('scanBtn');
const stopBtn = document.getElementById('stopBtn');
const pickBtn = document.getElementById('pickBtn');

const seen = new Map();   // device id -> latest advertisement info
let scan = null;

function setStatus(text) { statusEl.textContent = text; }

if (!navigator.bluetooth) {
  setStatus('Web Bluetooth isn\'t available here. Open this page in Bluefy.');
  scanBtn.disabled = pickBtn.disabled = true;
}

// --- Option 1: continuous scan of advertisements ---------------------------
// Nicknames you give devices, remembered on this phone.
const nicknames = loadNicknames();
function loadNicknames() {
  try { return JSON.parse(localStorage.getItem('bleNicknames')) || {}; } catch { return {}; }
}
function saveNicknames() {
  try { localStorage.setItem('bleNicknames', JSON.stringify(nicknames)); } catch {}
}
function friendlyName(id, advertisedName) {
  return nicknames[id] || advertisedName || null;
}

document.getElementById('showUnnamed').onchange = render;

function render() {
  const showUnnamed = document.getElementById('showUnnamed').checked;
  const rows = [...seen.values()]
    .filter(d => showUnnamed || friendlyName(d.id, d.name))
    .sort((a, b) => (b.rssi ?? -999) - (a.rssi ?? -999));
  listEl.id = 'scanList';
  listEl.innerHTML = '';
  for (const d of rows) {
    const li = document.createElement('li');
    li.innerHTML = `<div class="name"></div><div class="meta"></div>`;
    li.querySelector('.name').textContent = friendlyName(d.id, d.name) || 'Unnamed device';
    li.querySelector('.meta').textContent =
      `Signal ${d.rssi ?? '?'} dBm` +
      (nicknames[d.id] && d.name ? ` · advertises as "${d.name}"` : '') +
      ' · tap to rename';
    li.onclick = () => rename(d.id, d.name);
    listEl.appendChild(li);
  }
}

function rename(id, advertisedName) {
  const n = prompt('Nickname for this device (leave empty to clear):',
                   nicknames[id] || advertisedName || '');
  if (n === null) return;
  if (n.trim()) nicknames[id] = n.trim(); else delete nicknames[id];
  saveNicknames();
  render();
}

scanBtn.onclick = async () => {
  if (!navigator.bluetooth.requestLEScan) {
    setStatus('Continuous scanning isn\'t supported here. Use "Pick and connect" instead.');
    return;
  }
  try {
    seen.clear(); render();
    navigator.bluetooth.addEventListener('advertisementreceived', onAdvert);
    scan = await navigator.bluetooth.requestLEScan({ acceptAllAdvertisements: true });
    setStatus('Scanning…');
    scanBtn.disabled = true; stopBtn.disabled = false;
  } catch (err) {
    setStatus('Scan failed: ' + err.message);
  }
};

function onAdvert(e) {
  seen.set(e.device.id, {
    id: e.device.id,
    name: e.name || e.device.name,
    rssi: e.rssi,
    uuids: e.uuids || []
  });
  render();
}

stopBtn.onclick = () => {
  if (scan && scan.active) scan.stop();
  navigator.bluetooth.removeEventListener('advertisementreceived', onAdvert);
  setStatus(`Stopped. Found ${seen.size} device(s).`);
  scanBtn.disabled = false; stopBtn.disabled = true;
};

// --- Option 2: pick one device from the system chooser, connect, list services ---
// Names for standard Bluetooth services. Add your own device's UUIDs here too.
const std = n => `0000${n}-0000-1000-8000-00805f9b34fb`;
const SERVICE_NAMES = {
  [std('180f')]: 'Battery',
  [std('180a')]: 'Device information',
  [std('180d')]: 'Heart rate',
  [std('181a')]: 'Environmental sensing',
  [std('1800')]: 'Generic access',
  [std('1801')]: 'Generic attribute'
};
pickBtn.onclick = async () => {
  try {
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      // Services must be listed here to be readable after connecting.
      // Add your own device's service UUIDs to this array.
      optionalServices: ['battery_service', 'device_information', 'heart_rate']
    });
    const name = friendlyName(device.id, device.name) || 'Unnamed device';
    setStatus(`Connecting to ${name}…`);
    const server = await device.gatt.connect();
    const services = await server.getPrimaryServices();

    listEl.id = 'list';
    listEl.innerHTML = '';
    for (const s of services) {
      const li = document.createElement('li');
      li.innerHTML = `<div class="name"></div><div class="meta"></div>`;
      li.querySelector('.name').textContent = SERVICE_NAMES[s.uuid] || 'Custom service';
      li.querySelector('.meta').textContent = s.uuid;
      listEl.appendChild(li);
    }
    setStatus(`Connected to ${name}. ${services.length} service(s) visible.`);
  } catch (err) {
    setStatus('Stopped: ' + err.message);
  }
};
</script>
</body>
</html>
