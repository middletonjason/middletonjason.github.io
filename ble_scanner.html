<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transit Mode</title>
<style>
  :root {
    --bg: #15181c;
    --panel: #1b1f25;
    --panel-2: #20252c;
    --border: #2b313a;
    --text: #e6e3da;
    --text-dim: #8a909b;
    --text-dimmer: #5b6069;
    --accent: #e3a23d;
    --success: #4caf6d;
    --success-dim: #203528;
    --danger: #e2584f;
    --danger-dim: #3a2422;
    --info: #5b8def;
    --info-dim: #1e2a3d;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0 0 auto;
    height: env(safe-area-inset-top, 0px);
    background: var(--bg);
    z-index: 10;
  }

  .wrap {
    min-height: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 20px 40px;
    display: flex;
    flex-direction: column;
  }

  h1 {
    font-size: 16px;
    font-weight: 600;
    text-align: center;
    margin: 6px 0 24px;
    color: var(--text-dim);
    letter-spacing: 0.01em;
  }

  .banner {
    border: 1px solid var(--danger);
    background: rgba(226, 88, 79, 0.1);
    color: #f0b2ad;
    border-radius: 8px;
    padding: 13px 15px;
    font-size: 13px;
    line-height: 1.55;
    margin-bottom: 18px;
  }
  .banner strong { color: #fff; }

  /* ---------- status card ---------- */
  .status-card {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 24px;
    min-height: 260px;
    text-align: center;
    transition: border-color 0.2s, background 0.2s;
  }
  .status-card.busy { border-color: var(--info); background: var(--info-dim); }
  .status-card.success { border-color: var(--success); background: var(--success-dim); }
  .status-card.error { border-color: var(--danger); background: var(--danger-dim); }

  .status-ring {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 3px solid var(--text-dimmer);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .status-card.busy .status-ring {
    border-color: var(--info);
    border-top-color: transparent;
    animation: spin 0.9s linear infinite;
  }
  .status-card.success .status-ring { border-color: var(--success); }
  .status-card.error .status-ring { border-color: var(--danger); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .status-title {
    font-size: 17px;
    font-weight: 600;
  }
  .status-detail {
    font-size: 13px;
    color: var(--text-dim);
    max-width: 320px;
    line-height: 1.5;
  }
  .status-card.success .status-title { color: var(--success); }
  .status-card.error .status-title { color: var(--danger); }

  /* ---------- button ---------- */
  .scan-btn {
    margin-top: 22px;
    width: 100%;
    border: none;
    background: var(--accent);
    color: #1a1406;
    font-family: var(--sans);
    font-size: 16px;
    font-weight: 600;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
  }
  .scan-btn:active { filter: brightness(0.95); }
  .scan-btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .session-count {
    text-align: center;
    font-size: 12px;
    color: var(--text-dimmer);
    margin-top: 14px;
  }

  /* ---------- log ---------- */
  .log-toggle {
    margin-top: 22px;
    background: none;
    border: none;
    color: var(--text-dimmer);
    font-size: 12px;
    cursor: pointer;
    padding: 6px 2px;
    font-family: var(--sans);
    align-self: center;
  }
  .log-toggle:hover { color: var(--text-dim); }
  .log-panel {
    display: none;
    margin-top: 6px;
    background: #101317;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 10px 12px;
    max-height: 200px;
    overflow-y: auto;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text-dim);
    line-height: 1.6;
  }
  .log-panel.open { display: block; }
  .log-panel .t { color: var(--text-dimmer); margin-right: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Transit Mode</h1>

  <div id="unsupportedBanner" class="banner" style="display:none;">
    Web Bluetooth isn't available here. On iPhone/iPad, open this page in the <strong>Bluefy</strong> app.
    On desktop or Android, use <strong>Chrome</strong>, <strong>Edge</strong>, or <strong>Samsung Internet</strong>.
  </div>

  <div class="status-card" id="statusCard">
    <div class="status-ring" id="statusRing">•</div>
    <div class="status-title" id="statusTitle">Ready</div>
    <div class="status-detail" id="statusDetail">Tap below, then pick the unit you want to put in transit mode.</div>
  </div>

  <button class="scan-btn" id="scanBtn">Scan &amp; set transit mode</button>
  <div class="session-count" id="sessionCount">0 set this session</div>

  <button class="log-toggle" id="logToggle">▸ Debug log</button>
  <div class="log-panel" id="logPanel"></div>
</div>

<script>
(() => {
  "use strict";

  const SERVICE_UUID = "54571400-7c00-11e9-8f9e-2a86e4085a59";
  const CHAR_UUID    = "54571480-7c00-11e9-8f9e-2a86e4085a59";
  const TRANSIT_KEY  = new Uint8Array([
    0x4c, 0x57, 0x52, 0x49, 0x54, 0x45, 0x5f, 0xd3, 0x3a, 0xd1,
    0xb2, 0xc8, 0xa5, 0x6e, 0xf2, 0x92, 0xbe, 0x1e, 0x1e, 0xce,
    0x81, 0xe2, 0x31, 0xa2, 0x9d, 0xac, 0x10, 0x10, 0x57, 0x58
  ]);

  const NAME_FILTERS = [
    { namePrefix: "DriveDot-" },
    { namePrefix: "QMHConnect-" },
    { namePrefix: "QMH-" },
    { namePrefix: "IMS-" },
  ];
  const MAX_ATTEMPTS = 3;
  const RETRY_DELAYS = [400, 1000, 1800]; // backoff between attempts, ms

  const $ = (id) => document.getElementById(id);
  const statusCard = $("statusCard");
  const statusRing = $("statusRing");
  const statusTitle = $("statusTitle");
  const statusDetail = $("statusDetail");
  const scanBtn = $("scanBtn");
  const sessionCount = $("sessionCount");
  const logToggle = $("logToggle");
  const logPanel = $("logPanel");
  const unsupportedBanner = $("unsupportedBanner");

  let busy = false;
  let setCount = 0;
  let currentDevice = null; // the currently connected BluetoothDevice, if any

  function log(msg) {
    const t = new Date().toLocaleTimeString();
    const line = document.createElement("div");
    line.innerHTML = `<span class="t">${t}</span>${escapeHtml(msg)}`;
    logPanel.appendChild(line);
    logPanel.scrollTop = logPanel.scrollHeight;
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  logToggle.addEventListener("click", () => {
    logPanel.classList.toggle("open");
    logToggle.textContent = (logPanel.classList.contains("open") ? "▾" : "▸") + " Debug log";
  });

  if (!navigator.bluetooth || !navigator.bluetooth.requestDevice) {
    unsupportedBanner.style.display = "block";
    scanBtn.disabled = true;
  }

  function setStatus(state, title, detail) {
    statusCard.className = "status-card" + (state ? " " + state : "");
    statusTitle.textContent = title;
    statusDetail.textContent = detail || "";
    const ringGlyph = { idle: "•", busy: "", success: "✓", error: "✕" }[state] || "•";
    statusRing.textContent = ringGlyph;
  }

  function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

  async function ensurePreviousConnectionClosed() {
    // Guards against stacking a new connection on top of one that hasn't
    // finished tearing down yet, which is a common cause of a connect
    // silently failing right after a previous unit was processed.
    if (currentDevice && currentDevice.gatt && currentDevice.gatt.connected) {
      try { currentDevice.gatt.disconnect(); } catch (e) {}
      await sleep(300);
    }
    currentDevice = null;
  }

  async function scanAndSet() {
    if (busy) return;
    busy = true;
    scanBtn.disabled = true;

    await ensurePreviousConnectionClosed();

    setStatus("busy", "Opening picker…", "Choose the unit from the list.");
    let device;
    try {
      device = await navigator.bluetooth.requestDevice({
        filters: NAME_FILTERS,
        optionalServices: [SERVICE_UUID],
      });
    } catch (err) {
      if (err.name === "NotFoundError") {
        setStatus("idle", "Ready", "Cancelled, or no matching unit in range. Tap to try again.");
      } else {
        log("Picker error: " + err.message);
        setStatus("error", "Picker error", err.message);
      }
      busy = false;
      scanBtn.disabled = false;
      return;
    }

    currentDevice = device;
    const name = device.name || "(unnamed device)";
    log(`Selected: ${name}`);

    // Give iOS/Bluefy a moment to finish its own handshake after the
    // system picker hands the device back, before we try to connect.
    setStatus("busy", `Preparing ${name}`, "Settling connection…");
    await sleep(600);

    await writeTransitMode(device, name, 1);

    busy = false;
    scanBtn.disabled = false;
  }
  scanBtn.addEventListener("click", scanAndSet);

  async function writeTransitMode(device, name, attempt) {
    setStatus("busy", `Connecting to ${name}`, attempt > 1 ? `Retry ${attempt} of ${MAX_ATTEMPTS}…` : "Attempt 1…");

    let server;
    try {
      server = await device.gatt.connect();
      log(`${name}: connected (attempt ${attempt})`);

      setStatus("busy", `Writing to ${name}`, "Sending transit-mode command…");
      const service = await server.getPrimaryService(SERVICE_UUID);
      const char = await service.getCharacteristic(CHAR_UUID);
      await char.writeValueWithResponse(TRANSIT_KEY);
      await sleep(1000);

      setCount++;
      sessionCount.textContent = `${setCount} set this session`;
      log(`${name}: transit mode key written OK`);
      setStatus("success", `${name} set`, "It should stop advertising within a few seconds. Tap below for the next unit.");
    } catch (err) {
      log(`${name}: error on attempt ${attempt} — [${err.name}] ${err.message}`);
      if (attempt < MAX_ATTEMPTS) {
        await sleep(RETRY_DELAYS[attempt - 1] || 1000);
        return writeTransitMode(device, name, attempt + 1);
      }
      setStatus("error", `Failed: ${name}`, `${err.message} — tap below to try again.`);
    } finally {
      try { if (server && server.connected) server.disconnect(); } catch (e) {}
      currentDevice = null;
    }
  }
})();
</script>
</body>
</html>
